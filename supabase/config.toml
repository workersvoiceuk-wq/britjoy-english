# Supabase project settings used by `supabase functions deploy`.
# Stripe calls the webhook without a Supabase token; it checks Stripe's signature instead.
[functions.billing-webhook]
verify_jwt = false

[functions.britjoy-tutor]
verify_jwt = true

[functions.billing-checkout]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true

[functions.account-delete]
verify_jwt = true

[functions.academy-sync]
verify_jwt = true

# "Tu council" postcode lookup: public, no account needed (it only reads GOV.UK's open data).
[functions.council-finder]
verify_jwt = false

# «Inglés para el día a día»: estado de acceso y módulos de pago, solo con sesión.
[functions.vida-diaria]
verify_jwt = true
# El contenido de pago se lee del bucket privado «vida-diaria-premium» (Storage), nunca del repositorio.
