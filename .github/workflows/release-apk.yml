# Publishes the Android APK for direct download (web button "Descargar para Android").
# Run it by hand (Actions → "Britjoy English — Android APK download" → Run workflow)
# or push a tag like v1.0.0. The APK is attached to a GitHub release as
# britjoy-english.apk, so .../releases/latest/download/britjoy-english.apk always
# points to the newest one.
# - With the ANDROID_KEYSTORE_* secrets set, it builds a signed release APK.
# - Without them, it publishes a debug-signed beta APK (installable, but it can't be
#   updated in place by a later store/signed version: testers must uninstall first).
name: Britjoy English — Android APK download

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.0.0-beta.1)'
        required: true
        default: 'v1.0.0-beta.1'
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK (signed if the keystore secrets exist, otherwise debug beta)
        id: build
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BRITJOY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BRITJOY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BRITJOY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BRITJOY_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KS" ]; then
            export BRITJOY_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "$KS" | base64 --decode > "$BRITJOY_KEYSTORE_PATH"
            ./gradlew assembleRelease --no-daemon
            rm -f "$BRITJOY_KEYSTORE_PATH"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/britjoy-english.apk"
            echo "kind=signed" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/britjoy-english.apk"
            echo "kind=beta" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          KIND: ${{ steps.build.outputs.kind }}
        run: |
          NOTES="Britjoy English para Android ($KIND). Descarga britjoy-english.apk y ábrelo en el móvil (permite «instalar apps desconocidas»). Privacidad: https://workersvoiceuk-wq.github.io/britjoy-english/privacidad.html"
          # Not marked as pre-release on purpose: /releases/latest/download/... ignores pre-releases.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" britjoy-english.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" britjoy-english.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Britjoy English $TAG (Android)" --notes "$NOTES" --latest
          fi
