# Builds store-ready, signed apps. Run it by hand: Actions → "Britjoy English — store release" → Run workflow.
# It never publishes on its own: you upload the AAB to Google Play Console, and the iOS
# build only goes to TestFlight if you tick "upload_testflight".
#
# Required repository secrets (Settings → Secrets and variables → Actions). Never commit them.
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS:     APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   (App Store Connect API key, "App Manager" role)
name: Britjoy English — store release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (must be higher than the last one uploaded to each store)'
        required: true
        default: '1'
      upload_testflight:
        description: 'Upload the iOS build to TestFlight'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 and related secrets. See docs/PUBLICAR.md."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build signed release bundle (AAB)
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BRITJOY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BRITJOY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BRITJOY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BRITJOY_VERSION_CODE: ${{ inputs.build_number }}
        run: |
          export BRITJOY_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KS" | base64 --decode > "$BRITJOY_KEYSTORE_PATH"
          ./gradlew bundleRelease --no-daemon
          rm -f "$BRITJOY_KEYSTORE_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: britjoy-english-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY" ]; then
            echo "::error::Missing APPLE_TEAM_ID / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 secrets. See docs/PUBLICAR.md."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - name: Archive and export signed IPA
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $AUTH
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" $AUTH
          mkdir -p dist-ios && cp "$RUNNER_TEMP"/export/*.ipa dist-ios/britjoy-english.ipa
          rm -f "$KEY_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: britjoy-english-ios-release-ipa
          path: dist-ios/britjoy-english.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f dist-ios/britjoy-english.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
