# Tests and builds Britjoy English on every push:
#   web     – unit tests + end-to-end tests (Playwright) on the production build
#   android – debug APK, then installs and opens it on an Android emulator (screenshot)
#   ios     – Simulator build, then installs and opens it on an iPhone simulator (screenshot)
# Store releases (signed AAB / TestFlight) live in release.yml and need the owner's secrets.
name: Britjoy English — tests, Android & iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

# Modo IA: public endpoint + anon key of the Supabase tutor function (repository Variables,
# not secrets; the Claude API key never leaves Supabase). Empty = AI mode shows "not activated".
env:
  VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: britjoy-english-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an Android emulator
        uses: ReactiveCircus/android-emulator-runner@9125fe764b516df676e33c5e6df011c6f375ef88 # v2.36.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.workersvoiceuk.britjoyenglish/.MainActivity
            sleep 20
            adb shell pidof com.workersvoiceuk.britjoyenglish
            adb shell dumpsys activity activities | grep -E "ResumedActivity.*britjoyenglish"
            adb exec-out screencap -p > android-emulator.png
            adb logcat -d | grep -iE "Capacitor|chromium" | tail -40 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-screenshot
          path: android-emulator.png

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package the .app
        run: |
          cd ios/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/britjoy-english-ios-simulator.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: britjoy-english-ios-simulator
          path: britjoy-english-ios-simulator.zip
          if-no-files-found: error
      - name: Smoke test on an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          print(devs[-1]["udid"])')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.workersvoiceuk.britjoyenglish
          sleep 20
          xcrun simctl spawn "$UDID" launchctl list | grep -i britjoyenglish
          xcrun simctl io "$UDID" screenshot ios-simulator.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-screenshot
          path: ios-simulator.png
