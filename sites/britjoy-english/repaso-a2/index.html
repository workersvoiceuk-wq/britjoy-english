<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso A2 · BritJoy English</title>
<meta name="description" content="Inglés A2 con vídeos de capítulo y de repaso por pregunta. Práctica independiente de tu cuenta.">
<meta name="robots" content="noindex">
<style>
  :root { --ink: #0f1d40; --soft: #4b5b78; --bg: #faf6ee; --card: #fff; --line: #d9dfe9; --brand: #1d3a8a; --ok: #1f8f55; --bad: #c62f36; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--brand); color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  header a { color: #fff; font-weight: 700; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
  header a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #f5b400; outline-offset: 2px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: clamp(22px, 5vw, 30px); line-height: 1.2; margin: 6px 0 10px; }
  h2 { font-size: 19px; margin: 16px 0 8px; }
  .eyebrow { color: var(--brand); font-weight: 800; text-transform: uppercase; font-size: 13px; letter-spacing: .04em; margin: 8px 0 0; }
  .lead { color: var(--soft); } .note { color: var(--soft); font-size: 14px; }
  .scope { background: #eef3ff; border-left: 4px solid var(--brand); padding: 10px 12px; border-radius: 8px; font-size: 15px; }
  .lessons { list-style: none; padding: 0; display: grid; gap: 10px; }
  button { font: inherit; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 14px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .lesson { width: 100%; text-align: left; display: grid; gap: 2px; }
  .lesson span { color: var(--soft); font-size: 14px; } .lesson .done { color: var(--ok); font-weight: 700; }
  .primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 800; }
  .secondary { font-weight: 800; }
  .back { border: 0; background: none; padding-left: 0; color: var(--brand); font-weight: 700; }
  .options, .bank, .built, .match .col { display: grid; gap: 8px; }
  .bank, .built { display: flex; flex-wrap: wrap; } .built { min-height: 52px; border-bottom: 2px solid var(--line); padding: 6px 0; margin-bottom: 10px; }
  .option { text-align: left; } .option[aria-checked="true"] { border-color: var(--brand); background: #eef3ff; }
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .word.sel { border-color: var(--brand); background: #eef3ff; }
  .typed { width: 100%; font: inherit; padding: 12px; border-radius: 12px; border: 2px solid var(--brand); min-height: 48px; }
  .listen { display: flex; gap: 8px; margin-bottom: 10px; }
  .feedback { margin: 14px 0; } .right { color: var(--ok); font-weight: 800; } .wrong { color: var(--bad); font-weight: 800; } .answer { font-weight: 800; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; } .actions button { flex: 1 1 160px; }
  .clip { margin: 0; } video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 16 / 9; }
  figcaption { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 6px; font-size: 15px; }
  select { font: inherit; min-height: 44px; border-radius: 10px; border: 2px solid var(--line); padding: 6px 8px; }
  .explain p { margin: 0 0 10px; }
</style>
</head>
<body>
<header>
  <a href="../" data-return="britjoy-english">← Volver a BritJoy English</a>
  <span>Repaso A2</span>
</header>
<main id="app" aria-live="polite"><p>Cargando…</p></main>
<script src="app.js" defer></script>
</body>
</html>
